[project]
name = "mobius-amplify"
version = "0.1.0"
description = "The Inevitable Engine — Möbius Muse's AI marketing intelligence engine (Path A, plain Python)."
requires-python = ">=3.11"
dependencies = [
  "PyYAML==6.0.2",
  "jsonschema==4.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:amplify.*"]
