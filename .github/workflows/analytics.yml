name: analytics-and-editloop

# The Sunday-night step from docs/04. Manual only: analytics need stats that Samuel pasted
# from a platform, so a cron would either fail every week or invent data. Run it after
# `analytics/raw/<week>.yaml` exists.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week, e.g. 2026-W43 (blank = current)"
        required: false
        default: ""
      run_analyst_agent:
        description: "Let the Growth Analyst phrase the memo (uses tokens)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

concurrency:
  group: analytics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    name: analytics ingest and edit loop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Resolve week
        id: week
        run: |
          week="${{ github.event.inputs.week }}"
          if [ -z "$week" ]; then week=$(date -u +%G-W%V); fi
          echo "week=$week" >> "$GITHUB_OUTPUT"
          if [ ! -f "analytics/raw/${week}.yaml" ]; then
            echo "::error::analytics/raw/${week}.yaml is missing. Paste the platform stats first; the engine does not invent metrics."
            exit 1
          fi

      - name: Ingest supplied stats (deterministic memo)
        if: github.event.inputs.run_analyst_agent != 'true'
        run: python -m amplify ingest --week "${{ steps.week.outputs.week }}" --no-agent

      - name: Ingest supplied stats (Growth Analyst memo)
        if: github.event.inputs.run_analyst_agent == 'true'
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          if [ -z "${MISTRAL_API_KEY}" ]; then
            echo "::error::the Growth Analyst needs MISTRAL_API_KEY; re-run without the agent, or set the secret"
            exit 1
          fi
          python -m amplify ingest --week "$WEEK"

      - name: Write the weekly memo
        run: |
          week="${{ steps.week.outputs.week }}"
          if [ -f "content/review/${week}-analytics-memo.md" ]; then
            cat "content/review/${week}-analytics-memo.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No memo was produced for ${week}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Edit-loop proposal (never edits brand/)
        run: python -m amplify editloop --week "${{ steps.week.outputs.week }}"

      - name: Upload analytics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analytics-${{ steps.week.outputs.week }}
          path: |
            content/review/
            strategy/scores.json
            analytics/usage.jsonl
          if-no-files-found: warn
          retention-days: 90
